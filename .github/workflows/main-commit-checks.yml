name: Main Commit Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared
        run: pnpm --filter @chartsuno/shared build

      - name: Harness Checks
        run: pnpm check:harness

      - name: Workspace Lint
        run: pnpm lint

      - name: Web Type Check
        run: pnpm --dir packages/web exec tsc --noEmit

      - name: Regression Tests
        run: pnpm test

      - name: Web Production Build
        run: pnpm build:web

      - name: Bot Build
        run: pnpm --filter @chartsuno/bot build

      - name: Shared Node Entry Smoke Test
        run: node -e "import('./packages/shared/dist/node.js').then(() => console.log('shared node entry import ok'))"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/api/requirements.txt
            packages/api/requirements.lock

      - name: Install API Dependencies
        run: python -m pip install -r packages/api/requirements.txt -c packages/api/requirements.lock

      - name: Isolated API Regression Tests and Migration Checks
        run: python packages/api/scripts/test_api.py
