name: Main Commit Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Harness Checks
        run: pnpm check:harness

      - name: Workspace Lint
        run: pnpm lint

      - name: Web Type Check
        run: pnpm --dir packages/web exec tsc --noEmit
