name: Main Commit Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared
        run: pnpm --filter @chartsuno/shared build

      - name: Harness Checks
        run: pnpm check:harness

      - name: Workspace Lint
        run: pnpm lint

      - name: Web Type Check
        run: pnpm --dir packages/web exec tsc --noEmit

      - name: Bot Build
        run: pnpm --filter @chartsuno/bot build

      - name: Bot Renderer Import Smoke Test
        run: node -e "import('./packages/bot/dist/chart/renderer.js').then(() => console.log('renderer import ok'))"
