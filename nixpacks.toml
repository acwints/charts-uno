[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]

[phases.install]
cmds = ["npm install -g pnpm && pnpm install"]

[phases.build]
cmds = ["npm install -g pnpm && pnpm --filter @chartsuno/shared build && pnpm --filter @chartsuno/bot build"]

[start]
cmd = "mkdir -p /data && test -f /data/bot-state.json || cp packages/bot/bot-state.json /data/bot-state.json; node packages/bot/dist/index.js"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
