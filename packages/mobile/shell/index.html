<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chartsuno</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main {
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        color: #a1a1aa;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        background: #fafafa;
        color: #101014;
        border: 0;
        border-radius: 6px;
        padding: 12px 20px;
        min-height: 44px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chartsuno</h1>
      <p>You appear to be offline. Reconnect to load your charts and feed.</p>
      <button onclick="window.location.replace('https://chartsuno.com/feed')">Retry</button>
    </main>
  </body>
</html>
